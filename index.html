<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delivery Timer</title>
<style>
  :root{
    --bg:#0f1115;--card:#181b22;--line:#262a33;--txt:#eef0f4;--mut:#8b93a3;
    --acc:#3ddc84;--warn:#ffb020;--bad:#ff5a5f;--blue:#4ea1ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
  body{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 20px)}
  .wrap{max-width:520px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}
  #lang{font-size:15px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
  h1{font-size:18px;margin:0;font-weight:600;color:var(--mut)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--mut);margin:0 0 6px}
  input{width:100%;font-size:22px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b0d11;color:var(--txt)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .hint{font-size:14px;color:var(--mut);margin-top:10px}
  button{font:inherit;border:0;border-radius:14px;padding:14px;cursor:pointer;color:var(--txt);background:#262a33;font-size:16px}
  button:active{transform:scale(.98)}
  .primary{background:var(--acc);color:#04210f;font-weight:700;font-size:18px;width:100%}
  .done{width:100%;height:110px;font-size:42px;background:var(--acc);color:#04210f;font-weight:800;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:12px}
  .done span{font-size:20px}
  .done{flex-direction:column;gap:2px;line-height:1.1}
  .done .bl{font-size:30px;font-weight:800}
  .done .bs{font-size:14px;font-weight:600;opacity:.75}
  .done.drv{background:var(--blue);color:#04121f}
  .phase{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.03em;margin-left:6px;vertical-align:1px}
  .phase.drv{background:rgba(78,161,255,.18);color:var(--blue)}
  .phase.dlv{background:rgba(61,220,132,.18);color:var(--acc)}
  .split{display:flex;gap:14px;font-size:17px;margin-top:6px;font-variant-numeric:tabular-nums}
  .split b{font-weight:700}
  .split .on{text-decoration:underline;text-underline-offset:4px}
  .ratio{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px;background:#0b0d11}
  .ratio i{display:block;height:100%}
  .multi{margin-top:12px}
  .multi .k{margin-bottom:6px}
  .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .chips button{padding:12px 0;font-size:20px;font-weight:800;border-radius:12px;background:#0b0d11;border:1px solid var(--line)}
  .chips button.sel{background:var(--warn);color:#2a1a00;border-color:var(--warn)}
  .chips button:disabled{opacity:.25}
  body.basic .pro{display:none!important}
  body.basic table.lg th:nth-child(2),body.basic table.lg th:nth-child(3),body.basic table.lg td:nth-child(2),body.basic table.lg td:nth-child(3){display:none}
  .xn{display:inline-block;background:var(--warn);color:#2a1a00;border-radius:6px;padding:0 5px;font-size:12px;font-weight:800;margin-left:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
  .v.small{font-size:20px}
  .bar{height:10px;background:#0b0d11;border-radius:6px;overflow:hidden;margin-top:12px}
  .bar>i{display:block;height:100%;background:var(--blue);width:0}
  .cur .v{font-size:60px;letter-spacing:-1px}
  .sw small{font-size:.5em;opacity:.7}
  .cd{font-size:18px;margin-top:4px}
  .free .v{font-size:48px;text-align:center}
  .free .row{margin-top:10px}
  .cur .target{font-size:15px;color:var(--mut);margin-top:2px}
  .ok{color:var(--acc)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .status{font-size:17px;font-weight:600;text-align:center;padding:12px;border-radius:12px;background:#0b0d11}
  .tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tools button{font-size:14px;padding:12px 6px}
  .paused{background:var(--warn);color:#2a1a00}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
  td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mut);font-weight:500;font-size:12px}
  td:last-child,th:last-child{text-align:right}
  .hidden{display:none!important}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
  .modal .card{max-width:360px;width:100%}
  .modal p{margin:0 0 14px;font-size:17px}
  .finish{text-align:center}
  .topr{display:flex;gap:8px;align-items:center}
  .icon{padding:7px 11px;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
  .exp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .exp button{font-size:14px;padding:12px 8px}
  .exp .g{background:var(--blue);color:#04121f;font-weight:700}
  .hitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .hitem .d{font-weight:700;font-size:16px}
  .hitem .m{font-size:14px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
  .hhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .hhead button{padding:9px 12px;font-size:14px}
  .hhead b{font-size:17px}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#eef0f4;color:#0f1115;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .finish .v{font-size:40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 data-i="title"></h1><div class="topr"><button class="icon" id="histBtn" aria-label="History" style="font-size:20px;padding:5px 10px">📋</button><select id="lang"></select></div></div>

  <!-- SETUP -->
  <div id="setup">
    <div class="card">
      <div class="row">
        <div>
          <label for="cnt" data-i="parcels"></label>
          <input id="cnt" type="number" inputmode="numeric" min="1" value="80">
        </div>
        <div>
          <label for="hrs" data-i="hours"></label>
          <input id="hrs" type="number" inputmode="decimal" min="0.5" step="0.5" value="8">
        </div>
      </div>
      <div class="hint" id="preview"></div>
    </div>
    <button class="primary" id="startBtn" data-i="start"></button>
  </div>

  <!-- RUN -->
  <div id="run" class="hidden">
    <div class="card">
      <div class="grid">
        <div><div class="k" data-i="elapsed"></div><div class="v" id="elapsed">0:00:00</div></div>
        <div><div class="k" data-i="left"></div><div class="v" id="left">0:00:00</div></div>
      </div>
      <div class="bar"><i id="timeBar"></i></div>
    </div>

    <div class="card cur">
      <div class="k"><span id="swHead"></span><span class="phase pro" id="phTag"></span></div>
      <div class="v sw" id="curTime">00:00<small>.00</small></div>
      <div class="split pro"><span id="spDrive"></span><span id="spDeliv"></span><span id="spTotal"></span></div>
      <div class="cd"><span id="cdLbl"></span> <b id="curCount">0:00</b></div>
      <div class="target"><span data-i="normThis"></span> <b id="curTarget">0:00</b></div>
      <div class="bar"><i id="curBar"></i></div>
      <div class="multi"><div class="k" data-i="stopN"></div><div class="chips" id="chips"></div></div>
    </div>

    <button class="done" id="doneBtn"><span class="bl" id="bLbl"></span><span class="bs" id="bSub"></span></button>

    <div class="card pro" style="margin-top:12px">
      <div class="grid">
        <div><div class="k" data-i="driveTot"></div><div class="v small" id="tDrive" style="color:var(--blue)">0:00</div></div>
        <div><div class="k" data-i="delivTot"></div><div class="v small ok" id="tDeliv">0:00</div></div>
        <div><div class="k" data-i="avgDrive"></div><div class="v small" id="aDrive">—</div></div>
        <div><div class="k" data-i="avgDeliv"></div><div class="v small" id="aDeliv">—</div></div>
      </div>
      <div class="ratio"><i id="rDrive" style="background:var(--blue);width:0"></i><i id="rDeliv" style="background:var(--acc);width:0"></i></div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="grid">
        <div><div class="k" data-i="next"></div><div class="v small" id="nextT">—</div></div>
        <div><div class="k" data-i="plan"></div><div class="v small" id="planT">—</div></div>
        <div><div class="k" data-i="doneCnt"></div><div class="v small" id="doneCnt">0</div></div>
        <div><div class="k" data-i="leftCnt"></div><div class="v small" id="leftCnt">0</div></div>
      </div>
      <div class="bar"><i id="cntBar" style="background:var(--acc)"></i></div>
    </div>

    <div class="card"><div class="status" id="status">—</div></div>

    <div class="tools">
      <button id="pauseBtn"></button>
      <button id="undoBtn" data-i="undo"></button>
      <button id="resetBtn" data-i="finish"></button>
    </div>

    <div class="card free" style="margin-top:12px">
      <div class="k" data-i="freeSw"></div>
      <div class="v sw" id="fsw">00:00<small>.00</small></div>
      <div class="row"><button id="fswStart" style="background:var(--acc);color:#04210f;font-weight:700"></button><button id="fswLap" data-i="lap"></button><button id="fswReset" data-i="reset"></button></div>
      <table style="margin-top:8px"><tbody id="fswLaps"></tbody></table>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="k" style="margin-bottom:6px" data-i="log"></div>
      <table class="lg"><thead><tr><th>#</th><th>🚚</th><th>📦</th><th data-i="time"></th><th>±</th></tr></thead><tbody id="log"></tbody></table>
    </div>
  </div>

  <!-- FINISH -->
  <div id="finish" class="hidden">
    <div class="card finish">
      <div class="k" data-i="allDone"></div>
      <div class="v ok" id="fTotal">0:00:00</div>
      <div class="hint" id="fInfo"></div>
    </div>
    <div class="exp" style="margin:0 0 12px"><button id="fSave" data-i="saveXlsx"></button><button class="g" id="fShare" data-i="shareXlsx"></button></div>
    <button class="primary" id="newBtn" data-i="newShift"></button>
    <div class="card" style="margin-top:12px">
      <table class="lg"><thead><tr><th>#</th><th>🚚</th><th>📦</th><th data-i="time"></th><th>±</th></tr></thead><tbody id="fLog"></tbody></table>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="history" class="hidden">
    <div class="hhead"><button id="hBack" data-i="back"></button><b data-i="history"></b></div>
    <div class="card">
      <div class="k" data-i="exportAll"></div>
      <div class="hint" data-i="kept30"></div>
      <div class="exp"><button id="aSave" data-i="saveXlsx"></button><button class="g" id="aShare" data-i="shareXlsx"></button></div>
    </div>
    <div id="hList"></div>
  </div>

  <!-- HISTORY DETAIL -->
  <div id="hDetail" class="hidden">
    <div class="hhead"><button id="dBack" data-i="back"></button><b id="dTitle"></b></div>
    <div class="card finish">
      <div class="v" id="dTotal"></div>
      <div class="hint" id="dInfo"></div>
      <div class="exp"><button id="dSave" data-i="saveXlsx"></button><button class="g" id="dShare" data-i="shareXlsx"></button></div>
    </div>
    <button id="dDel" style="width:100%;background:#2a1517;color:var(--bad)" data-i="del"></button>
    <div class="card" style="margin-top:12px">
      <table class="lg"><thead><tr><th>#</th><th>🚚</th><th>📦</th><th data-i="time"></th><th>±</th></tr></thead><tbody id="dLog"></tbody></table>
    </div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<div class="modal hidden" id="modal">
  <div class="card">
    <p id="mText"></p>
    <div class="row"><button id="mNo" data-i="no"></button><button id="mYes" style="background:var(--bad)" data-i="yes"></button></div>
  </div>
</div>

const KEY='delivery-timer-v1';
const $=id=>document.getElementById(id);
let S=null;

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}

function fmt(ms,withH){
  const neg=ms<0; ms=Math.abs(ms);
  const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  const p=n=>String(n).padStart(2,'0');
  const out=(withH||h>0)?`${h}:${p(m)}:${p(s)}`:`${m}:${p(s)}`;
  return (neg?'−':'')+out;
}
// working time (pauses excluded)
function fmtSW(ms){
  ms=Math.max(0,ms);
  const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60,cs=Math.floor(ms%1000/10);
  const p=n=>String(n).padStart(2,'0');
  return (h?h+':':'')+p(m)+':'+p(s)+'<small>.'+p(cs)+'</small>';
}
function work(now){
  let paused=S.pausedTotal + (S.pauseStart? now-S.pauseStart : 0);
  return now - S.start - paused;
}

function preview(){
  const n=+$('cnt').value, h=+$('hrs').value;
  $('preview').textContent = (n>0&&h>0) ? t('preview',{t:fmt(h*3600000/n),r:(n/h).toFixed(1)}) : '';
}
$('cnt').oninput=preview; $('hrs').oninput=preview;

$('startBtn').onclick=()=>{
  const n=Math.floor(+$('cnt').value), h=+$('hrs').value;
  if(!(n>0&&h>0)) return;
  const now=Date.now();
  S={total:n,shift:h*3600000,start:now,pausedTotal:0,pauseStart:null,
     curStartWork:0,curTarget:h*3600000/n,log:[]};
  save(); show();
};

// Базовая версия: одна кнопка «Доставлено». PRO=true включает режимы Езда/Доставка.
const PRO=false;
document.body.classList.toggle('basic',!PRO);
let lastTap=0;
function cnt(log){return log.reduce((a,r)=>a+(r.n||1),0)}
function stopN(){const rem=S.total-cnt(S.log);return Math.max(1,Math.min(S.stopN||1,rem,5))}
function renderChips(){
  const rem=S.total-cnt(S.log), n=stopN(), c=$('chips');
  if(!c._b){c.innerHTML=[1,2,3,4,5].map(i=>`<button data-n="${i}">${i}</button>`).join('');
    c.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.stopN=+b.dataset.n;save();render();buzz(20)});c._b=1}
  c.querySelectorAll('button').forEach(b=>{const i=+b.dataset.n;b.classList.toggle('sel',i===n);b.disabled=i>rem});
}
function buzz(ms){try{ if(window.Android&&Android.vibrate) Android.vibrate(ms); else if(navigator.vibrate) navigator.vibrate(ms);}catch(e){}}
$('doneBtn').onclick=()=>{
  if(Date.now()-lastTap<700) return;   // защита от двойного нажатия
  lastTap=Date.now();
  if(S.pauseStart) togglePause();
  const now=Date.now(), w=work(now);
  if(PRO && S.phase!=='deliv'){            // ЕЗДА -> ДОСТАВКА
    S.phase='deliv'; S.phaseStartWork=w; S.curDriveMs=w-S.curStartWork;
    save(); render(); buzz(40); return;
  }
  // ДОСТАВКА -> ЕЗДА (посылка завершена)
  const dur=w - S.curStartWork, n=stopN();
  S.log.push(PRO?{dur,target:S.curTarget*n,at:w,ts:now,drive:S.curDriveMs,deliv:w-S.phaseStartWork,n}:{dur,target:S.curTarget*n,at:w,ts:now,n});
  S.phase='drive'; S.phaseStartWork=w; S.curDriveMs=0; S.stopN=1;
  S.curStartWork=w;
  const remParcels=S.total - cnt(S.log);
  if(remParcels<=0){S.finished=true; archive(S,w); save(); show(); return;}
  S.curTarget=Math.max(0,(S.shift - w)/remParcels);
  save(); render(); buzz(80);
};

$('undoBtn').onclick=()=>{
  if(PRO && S.phase==='deliv'){
    ask(t('undoPhase'),()=>{S.phase='drive';S.phaseStartWork=S.curStartWork;S.curDriveMs=0;save();render()});
    return;
  }
  if(!S.log.length) return;
  const lastN=S.log[S.log.length-1].n||1;
  ask(t('undoAsk',{n:cnt(S.log)-lastN+1}),()=>{
    const last=S.log.pop();
    S.curStartWork = last.at - last.dur;
    S.curTarget = last.target/(last.n||1);
    S.stopN = last.n||1;
    if(PRO && last.deliv!=null){S.phase='deliv';S.phaseStartWork=last.at-last.deliv;S.curDriveMs=last.drive||0}
    else {S.phase='drive';S.phaseStartWork=S.curStartWork;S.curDriveMs=0}
    save(); render();
  });
};

function togglePause(){
  const now=Date.now();
  if(S.pauseStart){S.pausedTotal+=now-S.pauseStart;S.pauseStart=null}
  else S.pauseStart=now;
  save(); render();
}
$('pauseBtn').onclick=togglePause;

$('resetBtn').onclick=()=>ask(t('resetAsk'),()=>{if(S.pauseStart){S.pausedTotal+=Date.now()-S.pauseStart;S.pauseStart=null} archive(S,work(Date.now())); S=null;try{localStorage.removeItem(KEY)}catch(e){};show()});
$('newBtn').onclick=()=>{S=null;try{localStorage.removeItem(KEY)}catch(e){};show()};

function ask(text,yes){
  $('mText').textContent=text; $('modal').classList.remove('hidden');
  $('mYes').onclick=()=>{$('modal').classList.add('hidden');yes()};
  $('mNo').onclick=()=>$('modal').classList.add('hidden');
}

function splitTot(log){let dr=0,dl=0,n=0,p=0;log.forEach(r=>{if(r.deliv!=null){dr+=r.drive||0;dl+=r.deliv;n++;p+=(r.n||1)}});return{dr,dl,n,p}}
function splitHtml(log){const x=PRO?splitTot(log):{n:0};return (log.length?'<br>'+t('fStops',{s:log.length}):'')+(x.n?` · 🚚 ${fmt(x.dr,true)} · 📦 ${fmt(x.dl,true)}<br>⌀ 🚚 ${fmt(x.dr/x.n)} / 📦 ${fmt(x.dl/x.p)}`:'')}
function rangeStr(log,i){let a=1;for(let k=0;k<i;k++)a+=(log[k].n||1);const n=log[i].n||1;return n>1?`${a}–${a+n-1}`:String(a)}
function logRows(log){
  log=log||S.log;
  return log.map((r,i)=>{
    const d=r.dur-r.target, c=d<=0?'ok':'bad';
    const dr=r.deliv!=null?fmt(r.drive||0):'—', dl=r.deliv!=null?fmt(r.deliv):'—';
    const nn=r.n||1;
    return `<tr><td>${rangeStr(log,i)}${nn>1?'<span class="xn">×'+nn+'</span>':''}</td><td style="color:var(--blue)">${dr}</td><td class="ok">${dl}</td><td>${fmt(r.dur)}</td><td class="${c}">${d<=0?'':'+'}${fmt(d)}</td></tr>`;
  }).reverse().join('');
}

function show(){
  const hv=view==='history', dv=typeof view==='number';
  $('history').classList.toggle('hidden',!hv);
  $('hDetail').classList.toggle('hidden',!dv);
  $('histBtn').classList.toggle('hidden',hv||dv);
  if(hv){renderHistory();['setup','run','finish'].forEach(i=>$(i).classList.add('hidden'));return}
  if(dv){renderDetail(view);['setup','run','finish'].forEach(i=>$(i).classList.add('hidden'));return}
  $('setup').classList.toggle('hidden',!!S);
  $('run').classList.toggle('hidden',!S||!!S.finished);
  $('finish').classList.toggle('hidden',!S||!S.finished);
  if(!S){preview();return}
  if(S.finished){
    const w=S.log.length?S.log[S.log.length-1].at:0;
    $('fTotal').textContent=fmt(w,true);
    const diff=S.shift-w;
    $('fInfo').innerHTML=t('fInfo',{n:S.total,a:fmt(w/S.total)})+' · '+(diff>=0?'<span class="ok">'+t('reserve',{t:fmt(diff,true)})+'</span>':'<span class="bad">'+t('overrun',{t:fmt(-diff,true)})+'</span>');
    $('fInfo').innerHTML+=splitHtml(S.log);
    $('fLog').innerHTML=logRows();
    return;
  }
  render();
}

function render(){
  if(!S||S.finished||view!==null) return;
  const now=Date.now(), w=work(now);
  const done=cnt(S.log), rem=S.total-done, nStop=stopN();
  const cur=w-S.curStartWork;
  const tgt=S.curTarget*nStop;
  const over=cur-tgt;
  const plan=S.shift/S.total;

  $('elapsed').textContent=fmt(w,true);
  const left=S.shift-w;
  $('left').textContent=fmt(left,true);
  $('left').className='v'+(left<0?' bad':'');
  $('timeBar').style.width=Math.min(100,w/S.shift*100)+'%';

  const dlv=PRO && S.phase==='deliv';
  const phStart=dlv?S.phaseStartWork:S.curStartWork;
  const drv=dlv?(S.curDriveMs||0):cur, dl=dlv?w-S.phaseStartWork:0;
  $('swHead').textContent=t('swHead',{n:nStop>1?`${done+1}–${done+nStop}`:done+1,t:S.total});
  renderChips();
  const tag=$('phTag'); tag.textContent=dlv?'📦 '+t('phDeliv'):'🚚 '+t('phDrive'); tag.className='phase pro '+(dlv?'dlv':'drv');
  $('curTime').innerHTML=fmtSW(w-phStart);
  $('spDrive').innerHTML=`🚚 <b>${fmt(drv)}</b>`; $('spDrive').className=dlv?'':'on';
  $('spDeliv').innerHTML=`📦 <b>${fmt(dl)}</b>`; $('spDeliv').className=dlv?'on':'';
  $('spTotal').innerHTML=`= <b>${fmt(cur)}</b>`;
  const last=rem-nStop<=0;
  const bb=$('doneBtn'); bb.classList.toggle('drv',!dlv);
  if(PRO){
    $('bLbl').textContent=dlv?(last?t('bLast'):t('bDrive')):t('bDeliv');
    $('bSub').textContent=dlv?(last?t('bLastSub'):t('bDriveSub')):t('bDelivSub');
  } else {
    bb.classList.remove('drv');
    $('bLbl').textContent='✓ '+t('deliveredBtn');
    $('bSub').textContent=nStop>1?'👥 ×'+nStop:'';
  }
  const tot=splitTot(S.log); const tdr=tot.dr+drv, tdl=tot.dl+dl;
  $('tDrive').textContent=fmt(tdr,true); $('tDeliv').textContent=fmt(tdl,true);
  $('aDrive').textContent=tot.n?fmt(tot.dr/tot.n):'—'; $('aDeliv').textContent=tot.p?fmt(tot.dl/tot.p):'—';
  const sumT=tdr+tdl||1; $('rDrive').style.width=(tdr/sumT*100)+'%'; $('rDeliv').style.width=(tdl/sumT*100)+'%';
  $('cdLbl').textContent=over<=0?t('toNorm'):t('overNorm');
  $('curCount').textContent=(over<=0?'':'+')+fmt(Math.abs(over));
  $('curCount').className=over<=0?'':'bad';
  $('curTarget').innerHTML=fmt(tgt)+(nStop>1?` <span class="xn">${fmt(S.curTarget)} ×${nStop}</span>`:'');
  const ratio=tgt>0?cur/tgt:2;
  const cls=ratio<0.8?'ok':ratio<=1?'warn':'bad';
  $('curTime').className='v '+cls;
  const cb=$('curBar'); cb.style.width=Math.min(100,ratio*100)+'%';
  cb.style.background= cls==='ok'?'var(--acc)':cls==='warn'?'var(--warn)':'var(--bad)';

  // next: if current is delivered right now
  if(rem-nStop>0){
    const nt=(S.shift-w)/(rem-nStop);
    $('nextT').textContent=fmt(Math.max(0,nt));
    $('nextT').className='v small '+(nt>=plan?'ok':nt>=plan*0.8?'warn':'bad');
  } else {$('nextT').textContent=t('last');$('nextT').className='v small'}
  $('planT').textContent=fmt(plan);
  $('doneCnt').textContent=done; $('leftCnt').textContent=rem;
  $('cntBar').style.width=(done/S.total*100)+'%';

  // ahead / behind schedule
  const expected=w/plan;           // how many should be done by now
  const delta=done-expected;       // in parcels
  const st=$('status');
  if(Math.abs(delta)<0.5){st.innerHTML='<span class="ok">'+t('onTrack')+'</span>'}
  else if(delta>0){st.innerHTML='<span class="ok">'+t('ahead',{n:delta.toFixed(1),t:fmt(delta*plan)})+'</span>'}
  else{st.innerHTML='<span class="bad">'+t('behind',{n:(-delta).toFixed(1),t:fmt(-delta*plan)})+'</span>'}

  const pb=$('pauseBtn');
  pb.textContent=S.pauseStart?'▶ '+t('resume'):t('pause');
  pb.classList.toggle('paused',!!S.pauseStart);
  if(S.pauseStart) st.innerHTML='<span class="warn">'+t('paused')+'</span>';

  $('undoBtn').disabled=!done; $('undoBtn').style.opacity=done?1:.4;
  const tb=$('log'); const html=logRows(); if(tb._h!==html){tb.innerHTML=html;tb._h=html}
}


// ===== history (30 days) =====
const HK='delivery-history-v1', DAY=86400000;
let view=null; // null | 'history' | record id
function loadH(){try{return JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){return[]}}
function saveH(h){try{localStorage.setItem(HK,JSON.stringify(h))}catch(e){}}

function archive(st,w){
  if(!st||!st.log||!st.log.length) return;
  const last=st.log[st.log.length-1];
  const rec={id:st.start,start:st.start,end:Math.max(last.ts||0,Date.now()),total:st.total,shift:st.shift,paused:st.pausedTotal||0,work:w,finished:!!st.finished,log:st.log};

}
function getRec(id){return loadH().find(r=>r.id===id)}
const dloc=()=>({en:'en-GB',de:'de-DE',ru:'ru-RU',uk:'uk-UA',pl:'pl-PL',ro:'ro-RO',tr:'tr-TR'})[lang];

  $('hList').querySelectorAll('.hitem').forEach(b=>b.onclick=()=>{view=+b.dataset.id;show();scrollTo(0,0)});

function sgn(ms){return (ms>=0?'+':'−')+fmt(Math.abs(ms),true)}
function serial(ts){return (ts-new Date(ts).getTimezoneOffset()*60000)/DAY+25569}
function buildRows(recs){

  recs.slice().sort((a,b)=>a.start-b.start).forEach(r=>{
    const sp=splitTot(r.log);
    sum.push([{d:r.start,f:4},{d:r.start,f:3},{d:r.end,f:3},r.total,cnt(r.log),{t:r.shift},{t:r.work},{t:r.paused},r.log.length,sp.n?{t:sp.dr}:'',sp.n?{t:sp.dl}:'',{t:r.work/cnt(r.log)},sp.n?{t:sp.dr/sp.n}:'',sp.p?{t:sp.dl/sp.p}:'',sgn(r.shift-r.work)]);
    r.log.forEach((x,i)=>del.push([{d:r.start,f:4},{d:r.start,f:3},i+1,rangeStr(r.log,i),x.n||1,x.deliv!=null?{t:x.drive||0}:'',x.deliv!=null?{t:x.deliv}:'',{t:x.dur},{t:x.target},((x.dur-x.target)>0?'+':'−')+fmt(Math.abs(x.dur-x.target)),x.ts?{d:x.ts,f:3}:'']));
  });
  if(!PRO){
    const cut=(rows,drop)=>rows.map(r=>r.filter((_,i)=>!drop.includes(i)));
    const sw=[14,9,9,12,11,12,12,10,10,12,12,14,12,12,16].filter((_,i)=>![9,10,12,13].includes(i));
    const dw=[14,9,10,10,9,10,10,10,10,11,12].filter((_,i)=>![5,6].includes(i));
    return [[t('shSummary'),cut(sum,[9,10,12,13]),sw],[t('shDeliv'),cut(del,[5,6]),dw]];
  }
  return [[t('shSummary'),sum,[14,9,9,12,11,12,12,10,10,12,12,14,12,12,16]],[t('shDeliv'),del,[14,9,10,10,9,10,10,10,10,11,12]]];

const xe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colL(i){let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26}return s}
function sheetXml(rows,widths){
  const cols='<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w+2}" customWidth="1"/>`).join('')+'</cols>';
  const body=rows.map((row,ri)=>`<row r="${ri+1}">`+row.map((v,ci)=>{
    const ref=colL(ci)+(ri+1), hs=ri===0?' s="1"':'';
    if(v===''||v==null) return '';
    if(typeof v==='number') return `<c r="${ref}"${hs}><v>${v}</v></c>`;
    if(typeof v==='object'&&'t' in v) return `<c r="${ref}" s="2"><v>${Math.max(0,v.t)/DAY}</v></c>`;
    if(typeof v==='object'&&'d' in v) return `<c r="${ref}" s="${v.f}"><v>${serial(v.d)}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${hs}><is><t>${xe(v)}</t></is></c>`;
  }).join('')+'</row>').join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${body}</sheetData></worksheet>`;
}
function buildXlsx(recs){
  const sheets=buildRows(recs), H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const files={
    '[Content_Types].xml':H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>',
    '_rels/.rels':H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml':H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((sh,i)=>`<sheet name="${xe(sh[0].slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>',
    'xl/_rels/workbook.xml.rels':H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
    'xl/styles.xml':H+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="hh:mm"/><numFmt numFmtId="165" formatCode="dd.mm.yyyy"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="46" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'
  };

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zipStore(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;

    const nb=enc.encode(name), data=enc.encode(files[name]), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(lh.buffer),nb,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nb);

  }
  const csz=cen.reduce((a,b)=>a+b.length,0), n=Object.keys(files).length;

  end.setUint32(0,0x06054b50,true);end.setUint16(8,n,true);end.setUint16(10,n,true);end.setUint32(12,csz,true);end.setUint32(16,off,true);

function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
const XMIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function exportRecs(recs,mode,tag){
  recs=recs.filter(Boolean); if(!recs.length){toast(t('noHistory'));return}
  const d=new Date(recs.length===1?recs[0].start:Date.now()), p=n=>String(n).padStart(2,'0');
  const name=`DeliveryTimer_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}${tag?'_'+tag:'_'+p(d.getHours())+p(d.getMinutes())}.xlsx`;

  }catch(e){toast(t('failed'))}
}
